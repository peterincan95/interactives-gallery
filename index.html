<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="#apps" data-text="siteName"></a>
      <nav class="tabs" role="tablist">
        <a class="tab" href="#apps" role="tab" data-tab="apps"></a>
        <a class="tab" href="#about" role="tab" data-tab="about"></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="panel-apps" class="panel" role="tabpanel">
      <ul class="grid" id="app-grid"></ul>
    </section>
    <section id="panel-about" class="panel" role="tabpanel" hidden>
      <article class="prose" id="about-content"></article>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
